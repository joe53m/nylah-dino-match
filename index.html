import sys
import asyncio
import platform
import json
from pathlib import Path

# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#111"

    platform.window.transfer.hidden = true
    bundle = "nylah_dino_web"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/nylah_dino_web
    appdir.mkdir()


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("nylah_dino_web.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("nylah_dino_web.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = main


    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(main, callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    platform.window.infobox.style.display = "none"
    platform.window.loading_screen.style.display = "none"
    platform.window.canvas.style.visibility = "visible"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    platform.window.sizeNylahGameCanvas()
    print("default.tmpl: done")

    shell.interactive()

asyncio.run( custom_site() )

    <script type="application/javascript">

    globalThis.__canvas_resized = (self, ecw, ech) => {
        console.warn("TODO: panda3d canvas monitor", self, ecw, ech)
    }

    async function custom_onload(debug_hidden) {
        // this is called before anything python is loaded
        // make your js customization here
        console.log(__FILE__, "custom_onload")

        pyconsole.hidden = debug_hidden
        system.hidden = debug_hidden
        transfer.hidden = debug_hidden
        info.hidden = debug_hidden
        box.hidden =  debug_hidden

        infobox.style.display = "none"

        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 480;
        const GAME_RATIO = GAME_WIDTH / GAME_HEIGHT;
        const PLAY_RECT = { left: 290, top: 335, right: 510, bottom: 445 };

        function sizeGameCanvas() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const viewportRatio = width / height;
            let displayWidth;
            let displayHeight;

            if (viewportRatio > GAME_RATIO) {
                displayHeight = height;
                displayWidth = height * GAME_RATIO;
            } else {
                displayWidth = width;
                displayHeight = width / GAME_RATIO;
            }

            canvas.style.setProperty("width", `${displayWidth}px`, "important");
            canvas.style.setProperty("height", `${displayHeight}px`, "important");
            console.log("[Nylah resize]", {
                innerWidth: width,
                innerHeight: height,
                displayWidth,
                displayHeight,
                canvasRect: canvas.getBoundingClientRect()
            });
        }

        window.addEventListener("resize", sizeGameCanvas);
        globalThis.sizeNylahGameCanvas = sizeGameCanvas;
        sizeGameCanvas();

        // Resume Web Audio only from a pointer that maps to the existing PLAY
        // button. getBoundingClientRect() keeps the hit test correct after CSS scaling.
        let playAudioGestureReceived = false;

        function unlockNylahAudioFromPlay(event) {
            if (playAudioGestureReceived) return;
            const rect = canvas.getBoundingClientRect();
            const point = event.touches?.[0] || event.changedTouches?.[0] || event;
            const gameX = (point.clientX - rect.left) * GAME_WIDTH / rect.width;
            const gameY = (point.clientY - rect.top) * GAME_HEIGHT / rect.height;
            if (gameX < PLAY_RECT.left || gameX > PLAY_RECT.right ||
                    gameY < PLAY_RECT.top || gameY > PLAY_RECT.bottom) return;

            console.log("[Nylah audio] PLAY gesture received", {
                eventType: event.type, gameX, gameY, canvasRect: rect
            });
            console.log("[Nylah audio] browser/WASM mode", {
                browser: navigator.userAgent,
                wasm: typeof WebAssembly !== "undefined",
                emscriptenModule: typeof globalThis.Module !== "undefined",
                pygameWeb: typeof globalThis.python !== "undefined"
            });

            // SDL2.audioContext is the context owned by pygame-web/Pygbag's
            // Emscripten SDL mixer. Keep fallbacks for alternate runtime builds.
            const candidates = [
                ["globalThis.SDL2.audioContext", globalThis.SDL2?.audioContext],
                ["globalThis.SDL.audioContext", globalThis.SDL?.audioContext],
                ["globalThis.Module.SDL2.audioContext", globalThis.Module?.SDL2?.audioContext],
                ["globalThis.Module.SDL.audioContext", globalThis.Module?.SDL?.audioContext],
                ["globalThis.Module.audioContext", globalThis.Module?.audioContext],
                ["globalThis.audioContext", globalThis.audioContext]
            ];
            const availableContexts = [];
            const seenContexts = new Set();
            for (const [path, context] of candidates) {
                if (context && typeof context.resume === "function" && !seenContexts.has(context)) {
                    seenContexts.add(context);
                    availableContexts.push([path, context]);
                }
            }
            if (!availableContexts.length) {
                console.log("[Nylah audio] detected AudioContext object/path: none", {
                    AudioContext: globalThis.AudioContext,
                    webkitAudioContext: globalThis.webkitAudioContext
                });
                console.error("[Nylah audio] audio failure exception: SDL WebAudio AudioContext was not exposed during the PLAY gesture");
                return;
            }
            playAudioGestureReceived = true;
            for (const [path, context] of availableContexts) {
                console.log("[Nylah audio] detected AudioContext object/path", path, context);
                console.log("[Nylah audio] AudioContext state before resume", context.state);
                try {
                    // This call must remain synchronous in this native PLAY event
                    // handler. Only observation of its Promise happens later.
                    const resumeResult = context.state === "suspended"
                        ? context.resume()
                        : undefined;
                    console.log("[Nylah audio] resume() result", resumeResult);
                    if (resumeResult && typeof resumeResult.then === "function") {
                        resumeResult.then(
                            () => console.log("[Nylah audio] AudioContext state after resume", context.state),
                            (error) => {
                                console.error("[Nylah audio] audio failure exception", error?.stack || error);
                                console.log("[Nylah audio] AudioContext state after resume", context.state);
                            }
                        );
                    } else {
                        console.log("[Nylah audio] AudioContext state after resume", context.state);
                    }
                } catch (error) {
                    console.error("[Nylah audio] audio failure exception", error?.stack || error);
                    console.log("[Nylah audio] AudioContext state after resume", context.state);
                }
            }
        }

        // pointerdown covers current Safari; touchstart and click are fallbacks
        // for older iOS/WebKit builds. The one-shot guard prevents duplicates.
        canvas.addEventListener("pointerdown", unlockNylahAudioFromPlay, { passive: true });
        canvas.addEventListener("touchstart", unlockNylahAudioFromPlay, { passive: true });
        canvas.addEventListener("click", unlockNylahAudioFromPlay, { passive: true });
    }
